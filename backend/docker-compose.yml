services:
  db:
    image: postgres:16-alpine
    container_name: the-pantheon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: companyos
      POSTGRES_USER: companyos
      POSTGRES_PASSWORD: change-me-before-use
    ports:
      - "5433:5432"
    volumes:
      - the_pantheon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companyos -d companyos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  the_pantheon_pgdata:
